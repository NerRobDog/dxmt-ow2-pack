# dxmt-ow2-pack — reference DXMT config for Overwatch.
#
# Point DXMT at this file with DXMT_CONFIG_FILE (install-dxmt.sh does it for you).
# Every value here was arrived at by measurement; the reasoning is in README.md.

# Frame pacing through Metal/CoreAnimation. The value is a DIVISOR of the display's
# refresh rate, not a free-form cap: ask for 40 on a 60 Hz panel and you get 30.
# Flat 16.67 ms beats the 38-87 fps sawtooth this replaced — see README, "Frametime
# over fps".
d3d11.preferredMaxFrameRate = 60

# Release the parsed shader IR as soon as the shader is created, rematerialising it
# only on a cache miss. Without it DXMT holds every shader's parsed IR forever:
# 7.7 GB live, 13 GB resident, the machine swaps. Requires a DXMT build that carries
# the patch (NerRobDog/dxmt, main) — a stock DXMT does not know this key.
d3d11.releaseShaderIR = True

# MetalFX spatial upscale of the SWAPCHAIN: 1728x1080 -> 2298x1436. This is an output
# upscale for sharpness, NOT a speed-up — it multiplies the output, it does not divide
# the render. Needs DXMT_METALFX_SPATIAL_SWAPCHAIN=1 in the environment.
d3d11.metalSpatialUpscaleFactor = 1.33

# Left OFF on purpose. True fixes the killcam, but trades it for constant micro-jitter
# across the whole match; the shader-IR release fixes the killcam without that cost.
d3d11.ignoreMapFlagNoWait = False
