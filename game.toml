contract = 1

[game]
id      = "ow2"
name    = "Overwatch 2"
status  = "rc"
summary = "13 GB resident down to 3.8 GB, flat 60 by Metal pacing - runs in your CrossOver bottle"

notes = """
The DXMT fork takes the game from 13 GB resident to 3.8 GB and stops the swapping
(d3d11.releaseShaderIR), and hands frame pacing to Metal, which turns a 38-87 fps
sawtooth into a flat 16.67 ms. Those numbers were measured over roughly 15 hours of
matches on an M1 Pro and an M5 Air, with the DLLs installed by hand, on CrossOver's
own Wine engine, and no account action was taken.

What is new here is the installing, not the translation layer: this pack puts the
same build in its own home and points your bottle at it, and that path has not yet
been confirmed on a running match. It stays rc until it has. You bring CrossOver
with Battle.net and Overwatch in a bottle; the pack ships no Wine engine.
"""

[source]
kind = "none"

[requires]
arch    = "arm64"
macos   = ">=26"
disk_gb = 1

[install]
home_authoritative = true
foreign_note = "modifies your CrossOver bottle - one file, cxbottle.conf, and the previous copy is kept beside it"
manual_url   = "https://github.com/NerRobDog/dxmt-ow2-pack#install"

[paths]
profile = "README-local.txt"
logs    = "logs"

[commands]
preflight    = "bash setup.sh --preflight"
install      = "bash setup.sh"
launch       = "ow2.sh"
launch_plain = "ow2.sh --plain"
uninstall    = "bash uninstall.sh"
